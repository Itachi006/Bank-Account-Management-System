# Default: embedded H2 database stored in ./data (no installation needed).
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/banking;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.h2.console.enabled=false

# To use MySQL instead, run with:  --spring.profiles.active=mysql  (see application-mysql.properties)
