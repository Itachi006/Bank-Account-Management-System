<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Account Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🏦 Bank Account Management</div>
    <div id="sessionInfo" class="session hidden">
      <span id="whoami"></span>
      <button id="logoutBtn" class="btn ghost">Log out</button>
    </div>
  </header>

  <main>
    <div id="toast" class="toast hidden" role="status"></div>

    <!-- AUTH VIEW -->
    <section id="authView" class="card narrow">
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="create">Open account</button>
      </div>

      <form id="loginForm" class="form">
        <label>Account number
          <input name="accountId" type="number" min="1" required inputmode="numeric" placeholder="e.g. 1">
        </label>
        <label>4-digit PIN
          <input name="pin" type="password" maxlength="4" pattern="\d{4}" required inputmode="numeric" placeholder="••••">
        </label>
        <button class="btn primary" type="submit">Log in</button>
      </form>

      <form id="createForm" class="form hidden">
        <label>Account holder name
          <input name="holderName" type="text" maxlength="100" required placeholder="Full name">
        </label>
        <label>Choose a 4-digit PIN
          <input name="pin" type="password" maxlength="4" pattern="\d{4}" required inputmode="numeric" placeholder="••••">
        </label>
        <label>Initial deposit (optional)
          <input name="initialDeposit" type="number" min="0" step="0.01" placeholder="0.00">
        </label>
        <button class="btn primary" type="submit">Create account</button>
      </form>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashView" class="hidden">
      <div class="card balance">
        <div class="muted">Available balance</div>
        <div id="balance" class="amount">$0.00</div>
        <div class="muted">Account #<span id="accountNo"></span></div>
      </div>

      <div class="grid">
        <form id="depositForm" class="card form">
          <h3>Deposit</h3>
          <input name="amount" type="number" min="0.01" step="0.01" required placeholder="Amount">
          <button class="btn primary" type="submit">Deposit</button>
        </form>

        <form id="withdrawForm" class="card form">
          <h3>Withdraw</h3>
          <input name="amount" type="number" min="0.01" step="0.01" required placeholder="Amount">
          <button class="btn primary" type="submit">Withdraw</button>
        </form>

        <form id="transferForm" class="card form">
          <h3>Transfer</h3>
          <input name="toAccountId" type="number" min="1" required placeholder="Recipient account #">
          <input name="amount" type="number" min="0.01" step="0.01" required placeholder="Amount">
          <button class="btn primary" type="submit">Send money</button>
        </form>
      </div>

      <div class="card">
        <div class="row between">
          <h3>Transaction history</h3>
          <button id="refreshBtn" class="btn ghost">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Type</th><th class="num">Amount</th><th>Description</th><th>Date &amp; time</th></tr>
            </thead>
            <tbody id="txnBody"></tbody>
          </table>
        </div>
        <p id="emptyMsg" class="muted hidden">No transactions yet.</p>
      </div>
    </section>
  </main>

  <footer>Core Java · JDBC · MySQL — web edition</footer>
  <script src="app.js"></script>
</body>
</html>
